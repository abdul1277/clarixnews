name: Update SEO files

on:
  push:
    branches:
      - main
    paths:
      - 'articles.js'
      - 'scripts/generate-seo.js'
      - '.github/workflows/update-seo-files.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate sitemap and RSS feed from articles.js
        run: node scripts/generate-seo.js
      - name: Commit generated SEO files
        run: |
          if git diff --quiet -- sitemap.xml rss.xml articles.json; then
            echo "SEO files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml rss.xml articles.json
          git commit -m "chore: refresh sitemap and RSS feed"
          git push
